services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${AI_PT_POSTGRES_DB:?AI_PT_POSTGRES_DB is required}
      POSTGRES_USER: ${AI_PT_POSTGRES_USER:?AI_PT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AI_PT_POSTGRES_PASSWORD:?AI_PT_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${AI_PT_MINIO_ROOT_USER:?AI_PT_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AI_PT_MINIO_ROOT_PASSWORD:?AI_PT_MINIO_ROOT_PASSWORD is required}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - minio_data:/data
    networks:
      - gateway
      - data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${AI_PT_MINIO_ROOT_USER:?AI_PT_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AI_PT_MINIO_ROOT_PASSWORD:?AI_PT_MINIO_ROOT_PASSWORD is required}
      MINIO_PUBLIC_BUCKET: ${AI_PT_MINIO_PUBLIC_BUCKET:?AI_PT_MINIO_PUBLIC_BUCKET is required}
    restart: "no"
    volumes:
      - ./infra/minio/scripts/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ./infra/minio/seed:/seed:ro
    networks:
      - data

  backend:
    image: ai-pt-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${AI_PT_POSTGRES_USER}:${AI_PT_POSTGRES_PASSWORD}@postgres:5432/${AI_PT_POSTGRES_DB}
      AI_INTEGRATIONS_OPENAI_API_KEY: ${AI_INTEGRATIONS_OPENAI_API_KEY:?AI_INTEGRATIONS_OPENAI_API_KEY is required}
      AI_INTEGRATIONS_OPENAI_BASE_URL: ${AI_INTEGRATIONS_OPENAI_BASE_URL:?AI_INTEGRATIONS_OPENAI_BASE_URL is required}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    networks:
      - gateway
      - data

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${AI_PT_PUBLIC_PORT:-18443}:80"
    depends_on:
      backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null --header='Host: api.a2t.jongchoi.com' http://127.0.0.1/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gateway

volumes:
  postgres_data:
  minio_data:

networks:
  gateway:
  data:
    internal: true
